[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipit-os"
version = "0.1.0"
description = "One command to ship ANY folder → APK + PyPI + GitHub Pages. No SDK. No NDK. No setup."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Shipit OS"}
]
keywords = ["android", "apk", "buildozer", "pypi", "github-pages", "acode", "termux", "ship"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13.0.0",
    "PyYAML>=6.0",
    "GitPython>=3.1.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
shipit = "shipit_os.cli:main"

[project.urls]
Homepage = "https://github.com/jangalacharansaisri963-eng/shipit-os"
Repository = "https://github.com/jangalacharansaisri963-eng/shipit-os"

[tool.setuptools.packages.find]
where = ["."]
include = ["shipit_os*"]
